<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSox" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#18233c"/>
      <stop offset="60%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgSox)"/>
  <circle cx="150" cy="150" r="140" fill="#38bdf8" opacity="0.12" filter="blur(40px)"/>
  <circle cx="450" cy="350" r="140" fill="#ffe259" opacity="0.12" filter="blur(40px)"/>

  <!-- SOCKS DISPLAY -->
  <g filter="url(#shadow)" transform="translate(130, 80)">
    <!-- Black Sock (Background Layer) -->
    <g transform="translate(-40, 20) scale(0.9)">
      <path d="M120,40 L190,40 L190,260 Q190,320 250,340 L310,360 Q340,370 320,400 Q280,420 220,390 L160,340 Q120,300 120,240 Z" fill="#0f172a" stroke="#334155" stroke-width="3"/>
      <!-- Compression Ribs -->
      <line x1="125" y1="70" x2="185" y2="70" stroke="#1e293b" stroke-width="3"/>
      <line x1="125" y1="90" x2="185" y2="90" stroke="#1e293b" stroke-width="3"/>
      <line x1="125" y1="110" x2="185" y2="110" stroke="#1e293b" stroke-width="3"/>
      <!-- White Grip Pads -->
      <circle cx="160" cy="320" r="5" fill="#38bdf8"/>
      <circle cx="180" cy="335" r="5" fill="#38bdf8"/>
      <circle cx="210" cy="355" r="5" fill="#38bdf8"/>
      <circle cx="240" cy="370" r="5" fill="#38bdf8"/>
      <circle cx="270" cy="380" r="5" fill="#38bdf8"/>
    </g>

    <!-- White Sock (Main Foreground Layer) -->
    <g transform="translate(40, 0)">
      <path d="M120,40 L195,40 L195,260 Q195,320 255,340 L315,360 Q350,370 330,405 Q290,425 225,395 L165,345 Q120,300 120,240 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
      <!-- Top Cuff Ribs -->
      <rect x="120" y="40" width="75" height="15" fill="#0f172a"/>
      <line x1="120" y1="75" x2="195" y2="75" stroke="#e2e8f0" stroke-width="3"/>
      <line x1="120" y1="95" x2="195" y2="95" stroke="#e2e8f0" stroke-width="3"/>
      <line x1="120" y1="115" x2="195" y2="115" stroke="#e2e8f0" stroke-width="3"/>
      <line x1="120" y1="135" x2="195" y2="135" stroke="#e2e8f0" stroke-width="3"/>

      <!-- GRIP LOGO ON ANKLE -->
      <rect x="135" y="180" width="45" height="24" rx="4" fill="#0f172a"/>
      <text x="157" y="196" font-family="'Montserrat', sans-serif" font-size="9" font-weight="900" fill="#38bdf8" text-anchor="middle">GRIP</text>

      <!-- BLACK SILICONE NON-SLIP TRACTION PADS (THE KEY FEATURE) -->
      <g fill="#0f172a">
        <!-- Heel pads -->
        <rect x="150" y="315" width="16" height="8" rx="4"/>
        <rect x="165" y="330" width="16" height="8" rx="4"/>
        <!-- Arch & Sole pads -->
        <rect x="185" y="345" width="16" height="8" rx="4"/>
        <rect x="205" y="358" width="16" height="8" rx="4"/>
        <rect x="225" y="370" width="16" height="8" rx="4"/>
        <rect x="245" y="380" width="16" height="8" rx="4"/>
        <rect x="268" y="388" width="16" height="8" rx="4"/>
        <rect x="290" y="392" width="16" height="8" rx="4"/>
        <!-- Second row of pads -->
        <rect x="200" y="340" width="14" height="7" rx="3.5" fill="#38bdf8"/>
        <rect x="225" y="352" width="14" height="7" rx="3.5" fill="#38bdf8"/>
        <rect x="250" y="364" width="14" height="7" rx="3.5" fill="#38bdf8"/>
        <rect x="275" y="374" width="14" height="7" rx="3.5" fill="#38bdf8"/>
      </g>
    </g>

    <!-- Pack 3X Ribbon Tag -->
    <g transform="translate(40, 90)">
      <polygon points="0,0 75,0 60,30 0,30" fill="url(#goldGrad)"/>
      <text x="32" y="20" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900" fill="#0f172a">PACK x3</text>
    </g>
  </g>

  <!-- Product Tag Badge -->
  <g transform="translate(300, 535)">
    <rect x="-195" y="-18" width="390" height="36" rx="18" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="0" y="6" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1">MEDIAS ANTIDESLIZANTES GRIP PRO • PACK X3</text>
  </g>
</svg>

