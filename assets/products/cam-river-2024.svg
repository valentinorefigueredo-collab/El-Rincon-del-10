<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgRiver" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#28171a"/>
      <stop offset="60%" stop-color="#12080a"/>
      <stop offset="100%" stop-color="#050203"/>
    </radialGradient>
    <linearGradient id="riverRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgRiver)"/>
  <circle cx="120" cy="90" r="140" fill="#ffffff" opacity="0.1" filter="blur(40px)"/>
  <circle cx="480" cy="90" r="140" fill="#dc2626" opacity="0.15" filter="blur(40px)"/>

  <!-- JERSEY RIVER PLATE -->
  <g filter="url(#shadow)" transform="translate(100, 70)">
    <path id="jBodyRiver" d="M120,40 L60,110 L10,85 L45,210 L105,175 L105,430 L295,430 L295,175 L355,210 L390,85 L340,110 L280,40 C250,65 150,65 120,40 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <clipPath id="clipRiver">
      <use href="#jBodyRiver"/>
    </clipPath>

    <g clip-path="url(#clipRiver)">
      <!-- The Iconic Diagonal Red Sash ("Banda Roja") from left shoulder down to right hip -->
      <polygon points="120,40 180,40 330,380 300,440 250,440 70,120" fill="url(#riverRed)"/>

      <!-- Red Shoulder Stripes Left -->
      <line x1="85" y1="58" x2="40" y2="92" stroke="#dc2626" stroke-width="4.5"/>
      <line x1="95" y1="52" x2="48" y2="88" stroke="#dc2626" stroke-width="4.5"/>
      <line x1="105" y1="46" x2="56" y2="84" stroke="#dc2626" stroke-width="4.5"/>

      <!-- Red Shoulder Stripes Right -->
      <line x1="315" y1="58" x2="360" y2="92" stroke="#dc2626" stroke-width="4.5"/>
      <line x1="305" y1="52" x2="352" y2="88" stroke="#dc2626" stroke-width="4.5"/>
      <line x1="295" y1="46" x2="344" y2="84" stroke="#dc2626" stroke-width="4.5"/>

      <!-- Sleeve Cuffs with Red & Black Rim -->
      <path d="M10,85 L45,210 L33,215 L-2,90 Z" fill="#dc2626"/>
      <path d="M390,85 L355,210 L367,215 L402,90 Z" fill="#dc2626"/>
    </g>

    <!-- White/Red Collar -->
    <path d="M135,42 C160,78 240,78 265,42 C240,66 160,66 135,42 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>

    <!-- CARP CREST (Left Chest on top of the red sash) -->
    <g transform="translate(138, 115) scale(0.75)">
      <path d="M0,0 L40,0 C40,25 35,45 20,55 C5,45 0,25 0,0 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
      <!-- Diagonal Red Stripe inside Shield -->
      <polygon points="0,0 15,0 40,35 40,50 25,55 0,15" fill="#dc2626"/>
      <circle cx="20" cy="28" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="20" y="32" font-family="'Montserrat', sans-serif" font-size="8" font-weight="900" fill="#000000" text-anchor="middle">CARP</text>
    </g>

    <!-- BRAND LOGO (Right Chest) -->
    <g transform="translate(242, 126) scale(0.8)">
      <polygon points="0,15 5,0 12,0 7,15" fill="#0f172a"/>
      <polygon points="10,15 15,4 22,4 17,15" fill="#0f172a"/>
      <polygon points="20,15 25,8 32,8 27,15" fill="#0f172a"/>
    </g>

    <!-- NUMBER 10 (Front Center in Black Athletic Font) -->
    <text x="200" y="295" font-family="'Oswald', sans-serif" font-size="88" font-weight="700" fill="#0f172a" text-anchor="middle">10</text>
    <text x="200" y="340" font-family="'Oswald', sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="6">EL MÁS GRANDE</text>
  </g>

  <!-- Tag Badge -->
  <g transform="translate(300, 535)">
    <rect x="-185" y="-18" width="370" height="36" rx="18" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <text x="0" y="6" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">RIVER PLATE 2024/25 • LA BANDA 10</text>
  </g>
</svg>

