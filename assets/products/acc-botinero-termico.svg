<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBag" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#192338"/>
      <stop offset="60%" stop-color="#0a101c"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>
    <linearGradient id="bagBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgBag)"/>
  <circle cx="150" cy="150" r="140" fill="#38bdf8" opacity="0.1" filter="blur(40px)"/>
  <circle cx="450" cy="350" r="140" fill="#ffe259" opacity="0.12" filter="blur(40px)"/>

  <!-- BOOT BAG (BOTINERO) -->
  <g filter="url(#shadow)" transform="translate(140, 100)">
    <!-- Carry Handle Top -->
    <path d="M110,35 Q160,-5 210,35" stroke="#334155" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M110,35 Q160,-5 210,35" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Main Bag Body -->
    <rect x="50" y="35" width="220" height="340" rx="30" fill="url(#bagBlack)" stroke="#334155" stroke-width="3"/>

    <!-- Front Zip Pocket Panel with Gold Seam -->
    <path d="M60,110 L260,110 L260,335 C260,350 250,360 235,360 L85,360 C70,360 60,350 60,335 Z" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>

    <!-- Gold Waterproof Zipper 1 (Horizontal) -->
    <line x1="65" y1="110" x2="255" y2="110" stroke="url(#goldGrad)" stroke-width="4"/>
    <polygon points="150,105 165,105 160,118 155,118" fill="url(#goldGrad)"/> <!-- Zip Puller -->

    <!-- Diagonal Waterproof Zipper 2 -->
    <line x1="80" y1="160" x2="240" y2="210" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 4"/>
    <circle cx="160" cy="185" r="5" fill="url(#goldGrad)"/>

    <!-- Side Breathable Mesh Vent for Cleats -->
    <g transform="translate(70, 240)">
      <rect x="0" y="0" width="180" height="40" rx="8" fill="#1e293b" opacity="0.6"/>
      <!-- Mesh ventilation dots -->
      <circle cx="20" cy="15" r="2.5" fill="#38bdf8"/>
      <circle cx="40" cy="15" r="2.5" fill="#38bdf8"/>
      <circle cx="60" cy="15" r="2.5" fill="#38bdf8"/>
      <circle cx="80" cy="15" r="2.5" fill="#38bdf8"/>
      <circle cx="100" cy="15" r="2.5" fill="#38bdf8"/>
      <circle cx="120" cy="15" r="2.5" fill="#38bdf8"/>
      <circle cx="140" cy="15" r="2.5" fill="#38bdf8"/>
      <circle cx="160" cy="15" r="2.5" fill="#38bdf8"/>
      <circle cx="30" cy="25" r="2.5" fill="#38bdf8"/>
      <circle cx="50" cy="25" r="2.5" fill="#38bdf8"/>
      <circle cx="70" cy="25" r="2.5" fill="#38bdf8"/>
      <circle cx="90" cy="25" r="2.5" fill="#38bdf8"/>
      <circle cx="110" cy="25" r="2.5" fill="#38bdf8"/>
      <circle cx="130" cy="25" r="2.5" fill="#38bdf8"/>
      <circle cx="150" cy="25" r="2.5" fill="#38bdf8"/>
    </g>

    <!-- BRAND EMBLEM "EL RINCÓN DEL 10" -->
    <g transform="translate(160, 75)">
      <!-- Gold Shield -->
      <polygon points="0,-20 18,-20 22,-3 11,10 0,-3" fill="url(#goldGrad)"/>
      <text x="11" y="-3" font-family="'Oswald', sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">10</text>
      <text x="11" y="22" font-family="'Montserrat', sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">EL RINCÓN DEL 10</text>
    </g>

    <!-- Waterproof Feature Tag -->
    <g transform="translate(160, 315)">
      <text x="0" y="0" font-family="'Montserrat', sans-serif" font-size="9" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">WATERPROOF • THERMAL PRO</text>
    </g>
  </g>

  <!-- Product Tag Badge -->
  <g transform="translate(300, 535)">
    <rect x="-195" y="-18" width="390" height="36" rx="18" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="0" y="6" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1">BOTINERO DEPORTIVO TÉRMICO E IMPERMEABLE</text>
  </g>
</svg>

