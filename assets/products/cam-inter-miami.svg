<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgMiami" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2d1728"/>
      <stop offset="60%" stop-color="#120914"/>
      <stop offset="100%" stop-color="#050206"/>
    </radialGradient>
    <linearGradient id="miamiPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgMiami)"/>
  <circle cx="120" cy="90" r="140" fill="#fb7185" opacity="0.18" filter="blur(40px)"/>
  <circle cx="480" cy="90" r="140" fill="#f43f5e" opacity="0.12" filter="blur(40px)"/>

  <!-- JERSEY INTER MIAMI -->
  <g filter="url(#shadow)" transform="translate(100, 70)">
    <!-- Base Flamingo Pink Jersey -->
    <path id="jBodyMiami" d="M120,40 L60,110 L10,85 L45,210 L105,175 L105,430 L295,430 L295,175 L355,210 L390,85 L340,110 L280,40 C250,65 150,65 120,40 Z" fill="url(#miamiPink)" stroke="#000000" stroke-width="2"/>

    <clipPath id="clipMiami">
      <use href="#jBodyMiami"/>
    </clipPath>

    <g clip-path="url(#clipMiami)">
      <!-- Black 3-Stripes on Shoulders -->
      <line x1="85" y1="58" x2="40" y2="92" stroke="#0f172a" stroke-width="4.5"/>
      <line x1="95" y1="52" x2="48" y2="88" stroke="#0f172a" stroke-width="4.5"/>
      <line x1="105" y1="46" x2="56" y2="84" stroke="#0f172a" stroke-width="4.5"/>

      <line x1="315" y1="58" x2="360" y2="92" stroke="#0f172a" stroke-width="4.5"/>
      <line x1="305" y1="52" x2="352" y2="88" stroke="#0f172a" stroke-width="4.5"/>
      <line x1="295" y1="46" x2="344" y2="84" stroke="#0f172a" stroke-width="4.5"/>

      <!-- Black Sleeve Ribbed Cuffs -->
      <path d="M10,85 L45,210 L33,215 L-2,90 Z" fill="#0f172a"/>
      <path d="M390,85 L355,210 L367,215 L402,90 Z" fill="#0f172a"/>
    </g>

    <!-- Black Collar with Pink Trim -->
    <path d="M135,42 C160,78 240,78 265,42 C240,66 160,66 135,42 Z" fill="#0f172a" stroke="#fb7185" stroke-width="2"/>

    <!-- INTER MIAMI CREST (Left Chest) -->
    <g transform="translate(142, 115) scale(0.8)">
      <circle cx="20" cy="20" r="18" fill="#0f172a" stroke="#fb7185" stroke-width="2.5"/>
      <!-- Two Herons -->
      <path d="M14,14 Q20,8 26,14 L20,30 Z" fill="#fb7185"/>
      <!-- Sun Rays -->
      <circle cx="20" cy="12" r="3" fill="#fb7185"/>
      <text x="20" y="34" font-family="'Montserrat', sans-serif" font-size="5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">MIAMI</text>
    </g>

    <!-- BRAND LOGO (Right Chest) -->
    <g transform="translate(242, 126) scale(0.8)">
      <polygon points="0,15 5,0 12,0 7,15" fill="#0f172a"/>
      <polygon points="10,15 15,4 22,4 17,15" fill="#0f172a"/>
      <polygon points="20,15 25,8 32,8 27,15" fill="#0f172a"/>
    </g>

    <!-- SPONSOR LOGO -->
    <g transform="translate(200, 190)">
      <path d="M-25,0 C0,-6 0,-6 25,0 C0,6 0,6 -25,0 Z" fill="#0f172a"/>
      <text x="0" y="16" font-family="'Montserrat', sans-serif" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">Royal Caribbean</text>
    </g>

    <!-- NUMBER 10 (Front Center in Black Inter Miami Font) -->
    <text x="200" y="295" font-family="'Oswald', sans-serif" font-size="88" font-weight="700" fill="#0f172a" text-anchor="middle">10</text>
    <text x="200" y="340" font-family="'Oswald', sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="6">MESSI</text>
  </g>

  <!-- Tag Badge -->
  <g transform="translate(300, 535)">
    <rect x="-185" y="-18" width="370" height="36" rx="18" fill="#0f172a" stroke="#fb7185" stroke-width="2"/>
    <text x="0" y="6" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#fb7185" text-anchor="middle" letter-spacing="1">INTER MIAMI CF 2024 • MESSI 10</text>
  </g>
</svg>

