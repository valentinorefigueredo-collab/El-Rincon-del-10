<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBrasil" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e2c1d"/>
      <stop offset="60%" stop-color="#0a1509"/>
      <stop offset="100%" stop-color="#030803"/>
    </radialGradient>
    <linearGradient id="brasilYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed136"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="brasilGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgBrasil)"/>
  <circle cx="120" cy="90" r="140" fill="#fed136" opacity="0.15" filter="blur(40px)"/>
  <circle cx="480" cy="90" r="140" fill="#16a34a" opacity="0.15" filter="blur(40px)"/>

  <!-- JERSEY BRASIL 1970 -->
  <g filter="url(#shadow)" transform="translate(100, 70)">
    <path id="jBodyBrasil" d="M120,40 L60,110 L10,85 L45,210 L105,175 L105,430 L295,430 L295,175 L355,210 L390,85 L340,110 L280,40 C250,65 150,65 120,40 Z" fill="url(#brasilYellow)" stroke="#000000" stroke-width="2"/>

    <clipPath id="clipBrasil">
      <use href="#jBodyBrasil"/>
    </clipPath>

    <g clip-path="url(#clipBrasil)">
      <!-- Green Sleeve Cuffs -->
      <path d="M10,85 L45,210 L30,215 L-5,90 Z" fill="url(#brasilGreen)"/>
      <path d="M390,85 L355,210 L370,215 L405,90 Z" fill="url(#brasilGreen)"/>
    </g>

    <!-- Iconic Green Round Crew Collar -->
    <path d="M135,42 C160,82 240,82 265,42 C240,65 160,65 135,42 Z" fill="url(#brasilGreen)" stroke="#0f172a" stroke-width="2"/>

    <!-- RETRO CBD CREST (Left Chest) -->
    <g transform="translate(142, 115) scale(0.75)">
      <!-- White and Green Shield -->
      <path d="M0,0 L40,0 C40,25 35,45 20,55 C5,45 0,25 0,0 Z" fill="#ffffff" stroke="url(#brasilGreen)" stroke-width="2.5"/>
      <!-- Green Cross -->
      <rect x="16" y="6" width="8" height="42" fill="url(#brasilGreen)"/>
      <rect x="6" y="16" width="28" height="8" fill="url(#brasilGreen)"/>
      <text x="20" y="32" font-family="'Montserrat', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">CBD</text>
      <!-- 3 Stars above (1958, 1962, 1970) -->
      <polygon points="12,-6 14,-2 18,-2 15,1 16,5 12,3 8,5 9,1 6,-2 10,-2" fill="#facc15"/>
      <polygon points="20,-9 22,-5 26,-5 23,-2 24,2 20,0 16,2 17,-2 14,-5 18,-5" fill="#facc15"/>
      <polygon points="28,-6 30,-2 34,-2 31,1 32,5 28,3 24,5 25,1 22,-2 26,-2" fill="#facc15"/>
    </g>

    <!-- NUMBER 10 (Front Center in Vintage Green Font) -->
    <text x="200" y="295" font-family="'Oswald', sans-serif" font-size="95" font-weight="700" fill="url(#brasilGreen)" text-anchor="middle">10</text>
    <text x="200" y="340" font-family="'Oswald', sans-serif" font-size="20" font-weight="700" fill="url(#brasilGreen)" text-anchor="middle" letter-spacing="6">PELÉ</text>
  </g>

  <!-- Tag Badge -->
  <g transform="translate(300, 535)">
    <rect x="-185" y="-18" width="370" height="36" rx="18" fill="#0f172a" stroke="url(#brasilYellow)" stroke-width="2"/>
    <text x="0" y="6" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#fed136" text-anchor="middle" letter-spacing="1">BRASIL 1970 RETRO • PELÉ 10</text>
  </g>
</svg>

