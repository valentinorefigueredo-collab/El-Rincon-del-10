<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCanilleras" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1b2333"/>
      <stop offset="60%" stop-color="#0b101a"/>
      <stop offset="100%" stop-color="#04060b"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <!-- Carbon Fiber Twill Weave Pattern -->
    <pattern id="carbonPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#111827"/>
      <polygon points="0,0 8,0 0,8" fill="#1f2937"/>
      <polygon points="8,0 16,8 8,8" fill="#374151"/>
      <polygon points="0,8 8,16 0,16" fill="#374151"/>
      <polygon points="8,8 16,8 16,16 8,16" fill="#1f2937"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgCanilleras)"/>
  <circle cx="200" cy="180" r="140" fill="#38bdf8" opacity="0.1" filter="blur(40px)"/>
  <circle cx="400" cy="350" r="140" fill="#ffe259" opacity="0.1" filter="blur(40px)"/>

  <!-- SHIN GUARDS (PAIR) -->
  <g filter="url(#shadow)" transform="translate(140, 80)">
    <!-- LEFT SHIN GUARD -->
    <g transform="translate(30, 20) rotate(-8, 80, 200)">
      <!-- EVA Foam Backing (black/blue padding edge) -->
      <path d="M50,40 C110,35 125,45 140,70 C155,120 145,260 120,340 C105,385 65,385 50,370 C35,320 25,120 50,40 Z" fill="#0369a1"/>
      
      <!-- Carbon Plate Surface -->
      <path d="M55,45 C105,40 120,50 135,75 C148,122 138,258 115,335 C100,378 68,378 55,365 C40,318 32,122 55,45 Z" fill="url(#carbonPattern)" stroke="url(#goldGrad)" stroke-width="2.5"/>

      <!-- Glossy Reflection Light Curve -->
      <path d="M60,60 Q85,180 75,340 Q65,220 58,100 Z" fill="#ffffff" opacity="0.15"/>

      <!-- Gold 10 Shield Emblem -->
      <g transform="translate(85, 170)">
        <polygon points="0,0 20,0 25,20 10,35 -5,20" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5"/>
        <text x="10" y="24" font-family="'Oswald', sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">10</text>
      </g>
      
      <text x="95" y="320" font-family="'Montserrat', sans-serif" font-size="7" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">CARBON PRO</text>
    </g>

    <!-- RIGHT SHIN GUARD -->
    <g transform="translate(160, 20) rotate(8, 80, 200)">
      <!-- EVA Foam Backing -->
      <path d="M50,40 C110,35 125,45 140,70 C155,120 145,260 120,340 C105,385 65,385 50,370 C35,320 25,120 50,40 Z" fill="#0369a1"/>
      
      <!-- Carbon Plate Surface -->
      <path d="M55,45 C105,40 120,50 135,75 C148,122 138,258 115,335 C100,378 68,378 55,365 C40,318 32,122 55,45 Z" fill="url(#carbonPattern)" stroke="url(#goldGrad)" stroke-width="2.5"/>

      <!-- Glossy Reflection Light Curve -->
      <path d="M125,60 Q110,180 105,340 Q118,220 128,100 Z" fill="#ffffff" opacity="0.15"/>

      <!-- Gold 10 Shield Emblem -->
      <g transform="translate(85, 170)">
        <polygon points="0,0 20,0 25,20 10,35 -5,20" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5"/>
        <text x="10" y="24" font-family="'Oswald', sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">10</text>
      </g>
      
      <text x="95" y="320" font-family="'Montserrat', sans-serif" font-size="7" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">CARBON PRO</text>
    </g>

    <!-- Ultra Light Tag Badge -->
    <g transform="translate(100, 395)">
      <rect x="0" y="0" width="120" height="26" rx="13" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <text x="60" y="17" font-family="'Montserrat', sans-serif" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">⚡ 45 GRAMOS</text>
    </g>
  </g>

  <!-- Product Tag Badge -->
  <g transform="translate(300, 535)">
    <rect x="-195" y="-18" width="390" height="36" rx="18" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="0" y="6" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1">CANILLERAS DE FIBRA DE CARBONO PRO</text>
  </g>
</svg>

