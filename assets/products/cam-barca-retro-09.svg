<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBarca" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1f142c"/>
      <stop offset="60%" stop-color="#0e0817"/>
      <stop offset="100%" stop-color="#040208"/>
    </radialGradient>
    <linearGradient id="barcaBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#004d98"/>
      <stop offset="100%" stop-color="#002d5c"/>
    </linearGradient>
    <linearGradient id="barcaRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a50044"/>
      <stop offset="100%" stop-color="#6d002d"/>
    </linearGradient>
    <linearGradient id="barcaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed136"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgBarca)"/>
  <circle cx="120" cy="90" r="140" fill="#004d98" opacity="0.2" filter="blur(40px)"/>
  <circle cx="480" cy="90" r="140" fill="#a50044" opacity="0.2" filter="blur(40px)"/>

  <!-- JERSEY BARCA 2008/09 SEXTETE -->
  <g filter="url(#shadow)" transform="translate(100, 70)">
    <path id="jBodyBarca" d="M120,40 L60,110 L10,85 L45,210 L105,175 L105,430 L295,430 L295,175 L355,210 L390,85 L340,110 L280,40 C250,65 150,65 120,40 Z" fill="#004d98" stroke="#000000" stroke-width="2"/>

    <clipPath id="clipBarca">
      <use href="#jBodyBarca"/>
    </clipPath>

    <!-- Half and Half Design -->
    <g clip-path="url(#clipBarca)">
      <!-- Right Half Garnet (Red) -->
      <rect x="200" y="0" width="200" height="450" fill="url(#barcaRed)"/>
      <!-- Right Sleeve Garnet -->
      <path d="M295,175 L355,210 L390,85 L340,110 L280,40 Z" fill="url(#barcaBlue)"/>
      <!-- Left Sleeve Blue -->
      <path d="M120,40 L60,110 L10,85 L45,210 L105,175 Z" fill="url(#barcaRed)"/>
      <!-- Sleeve Cuffs Yellow Piping -->
      <line x1="43" y1="205" x2="12" y2="90" stroke="url(#barcaGold)" stroke-width="3"/>
      <line x1="357" y1="205" x2="388" y2="90" stroke="url(#barcaGold)" stroke-width="3"/>
    </g>

    <!-- Yellow V-Neck Collar -->
    <path d="M135,42 C160,78 240,78 265,42 C240,65 160,65 135,42 Z" fill="#0f172a" stroke="url(#barcaGold)" stroke-width="3"/>

    <!-- BARCELONA CREST (Left Chest) -->
    <g transform="translate(142, 115) scale(0.75)">
      <!-- Crest Body -->
      <path d="M0,5 C0,0 5,0 10,0 L30,0 C35,0 40,0 40,5 C40,25 35,45 20,55 C5,45 0,25 0,5 Z" fill="url(#barcaGold)" stroke="#000" stroke-width="1.5"/>
      <!-- Top Half Split -->
      <rect x="4" y="4" width="16" height="18" fill="#ffffff"/>
      <line x1="12" y1="4" x2="12" y2="22" stroke="#dc2626" stroke-width="4"/>
      <line x1="4" y1="13" x2="20" y2="13" stroke="#dc2626" stroke-width="4"/>
      <!-- Senyera Top Right -->
      <rect x="20" y="4" width="16" height="18" fill="#facc15"/>
      <line x1="24" y1="4" x2="24" y2="22" stroke="#dc2626" stroke-width="2"/>
      <line x1="29" y1="4" x2="29" y2="22" stroke="#dc2626" stroke-width="2"/>
      <line x1="34" y1="4" x2="34" y2="22" stroke="#dc2626" stroke-width="2"/>
      <!-- Bottom Half Blue and Red Stripes -->
      <rect x="4" y="24" width="32" height="26" fill="url(#barcaBlue)"/>
      <rect x="12" y="24" width="8" height="26" fill="url(#barcaRed)"/>
      <rect x="26" y="24" width="8" height="26" fill="url(#barcaRed)"/>
      <!-- Soccer Ball in center bottom -->
      <circle cx="20" cy="38" r="5" fill="#facc15" stroke="#78350f" stroke-width="1"/>
    </g>

    <!-- BRAND LOGO (Right Chest) -->
    <path d="M245,130 C255,125 265,123 275,120 C270,128 260,135 245,137 C242,137 240,134 245,130 Z" fill="url(#barcaGold)"/>

    <!-- UNICEF LOGO (Center) -->
    <g transform="translate(200, 195)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="url(#barcaGold)" stroke-width="1.5"/>
      <text x="0" y="18" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="url(#barcaGold)" text-anchor="middle" letter-spacing="2">unicef</text>
    </g>

    <!-- NUMBER 10 (Front Center in Yellow 2009 Font) -->
    <text x="200" y="295" font-family="'Oswald', sans-serif" font-size="88" font-weight="700" fill="url(#barcaGold)" text-anchor="middle">10</text>
    <text x="200" y="340" font-family="'Oswald', sans-serif" font-size="20" font-weight="700" fill="url(#barcaGold)" text-anchor="middle" letter-spacing="6">MESSI</text>
  </g>

  <!-- Tag Badge -->
  <g transform="translate(300, 535)">
    <rect x="-195" y="-18" width="390" height="36" rx="18" fill="#0f172a" stroke="url(#barcaGold)" stroke-width="2"/>
    <text x="0" y="6" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1">FC BARCELONA 2008/09 • SEXTETE • MESSI 10</text>
  </g>
</svg>

