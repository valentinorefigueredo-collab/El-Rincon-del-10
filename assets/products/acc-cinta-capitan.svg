<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCap" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#19253d"/>
      <stop offset="60%" stop-color="#09101d"/>
      <stop offset="100%" stop-color="#03060c"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <linearGradient id="celesteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#75aadb"/>
      <stop offset="100%" stop-color="#4a90e2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgCap)"/>
  <circle cx="150" cy="200" r="140" fill="#75aadb" opacity="0.12" filter="blur(40px)"/>
  <circle cx="450" cy="300" r="140" fill="#ffe259" opacity="0.12" filter="blur(40px)"/>

  <!-- CAPTAIN ARMBAND (BRAZALETE DE CAPITÁN) -->
  <g filter="url(#shadow)" transform="translate(100, 160)">
    <!-- 3D Curved Armband Loop -->
    <path d="M0,100 C0,30 400,30 400,100 L400,180 C400,250 0,250 0,180 Z" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>

    <clipPath id="armbandClip">
      <path d="M0,100 C0,30 400,30 400,100 L400,180 C400,250 0,250 0,180 Z"/>
    </clipPath>

    <g clip-path="url(#armbandClip)">
      <!-- Top Celeste Stripe -->
      <path d="M0,100 C0,30 400,30 400,100 L400,125 C400,55 0,55 0,125 Z" fill="url(#celesteGrad)"/>
      <!-- Middle White Stripe -->
      <path d="M0,125 C0,55 400,55 400,125 L400,155 C400,85 0,85 0,155 Z" fill="#ffffff"/>
      <!-- Bottom Celeste Stripe -->
      <path d="M0,155 C0,85 400,85 400,155 L400,180 C400,110 0,110 0,180 Z" fill="url(#celesteGrad)"/>

      <!-- Golden Trim Lines -->
      <path d="M0,100 C0,30 400,30 400,100" stroke="url(#goldGrad)" stroke-width="4" fill="none"/>
      <path d="M0,180 C0,250 400,250 400,180" stroke="url(#goldGrad)" stroke-width="4" fill="none"/>

      <!-- Elastic Ribbing Texture Lines -->
      <line x1="30" y1="80" x2="30" y2="200" stroke="#000000" stroke-width="1.5" opacity="0.3"/>
      <line x1="60" y1="75" x2="60" y2="205" stroke="#000000" stroke-width="1.5" opacity="0.3"/>
      <line x1="90" y1="72" x2="90" y2="208" stroke="#000000" stroke-width="1.5" opacity="0.3"/>
      <line x1="310" y1="72" x2="310" y2="208" stroke="#000000" stroke-width="1.5" opacity="0.3"/>
      <line x1="340" y1="75" x2="340" y2="205" stroke="#000000" stroke-width="1.5" opacity="0.3"/>
      <line x1="370" y1="80" x2="370" y2="200" stroke="#000000" stroke-width="1.5" opacity="0.3"/>

      <!-- Black Center Emblem Shield Behind C -->
      <circle cx="200" cy="140" r="55" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3"/>
      <!-- Sun of May Silhouette in background of C -->
      <circle cx="200" cy="140" r="42" fill="url(#celesteGrad)" opacity="0.3"/>
    </g>

    <!-- THE BOLD "C" EMBROIDERED LETTER (CAPITÁN) -->
    <g transform="translate(200, 140)">
      <!-- Outer Glow and Shadow -->
      <text x="0" y="28" font-family="'Impact', 'Oswald', sans-serif" font-size="82" font-weight="900" fill="#000000" text-anchor="middle" opacity="0.7">C</text>
      <text x="-2" y="26" font-family="'Impact', 'Oswald', sans-serif" font-size="82" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">C</text>
    </g>

    <!-- Velcro Safety Tab on Right Side -->
    <rect x="365" y="115" width="22" height="50" rx="4" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <line x1="376" y1="120" x2="376" y2="160" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 2"/>

    <!-- Small Star Badge on top left -->
    <g transform="translate(80, 140)">
      <polygon points="0,-12 3,-3 12,-3 5,2 7,11 0,6 -7,11 -5,2 -12,-3 -3,-3" fill="url(#goldGrad)"/>
    </g>
    <g transform="translate(320, 140)">
      <polygon points="0,-12 3,-3 12,-3 5,2 7,11 0,6 -7,11 -5,2 -12,-3 -3,-3" fill="url(#goldGrad)"/>
    </g>
  </g>

  <!-- Product Tag Badge -->
  <g transform="translate(300, 535)">
    <rect x="-195" y="-18" width="390" height="36" rx="18" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="0" y="6" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1">CINTA DE CAPITÁN ELÁSTICA DE ALTO AJUSTE</text>
  </g>
</svg>

